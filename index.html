<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- start the profile photo and navbar logo downloads with the HTML instead of waiting for the JS bundle -->
    <link rel="preload" as="image" href="/assets/images/hero-image.webp" fetchpriority="high">
    <link rel="preload" as="image" href="/favicon.svg">
    <!-- icon font is only requested once Vue renders an icon; preloading avoids icons popping in late -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/primeicons/fonts/primeicons.woff2">
    <!-- text only appears once Vue renders, so a preloaded font that beats the JS bundle never swaps -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-latin.woff2">
    <title>Piero Delgado | Software Engineer</title>
    <meta name="description" content="Android Developer at Fitia, building mobile apps with Kotlin and Jetpack Compose. UPC Software Engineering student; side projects in Vue, React and Spring Boot.">
    <link rel="canonical" href="https://pierodelgado.dev/">

    <meta property="og:type" content="profile">
    <meta property="og:url" content="https://pierodelgado.dev/">
    <meta property="og:title" content="Piero Delgado | Software Engineer">
    <meta property="og:description" content="Android Developer at Fitia, building mobile apps with Kotlin and Jetpack Compose. UPC Software Engineering student; side projects in Vue, React and Spring Boot.">
    <meta property="og:image" content="https://pierodelgado.dev/assets/images/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Piero Delgado",
      "alternateName": "Piero Gonzalo Delgado Corrales",
      "url": "https://pierodelgado.dev/",
      "image": "https://pierodelgado.dev/assets/images/hero-image.webp",
      "jobTitle": "Software Engineer",
      "alumniOf": "Universidad Peruana de Ciencias Aplicadas (UPC)",
      "sameAs": [
        "https://www.linkedin.com/in/piero-delgado/",
        "https://github.com/PieroD04"
      ]
    }
    </script>
  </head>
  <body>
    <!-- Netlify only detects forms in the static HTML, so this copy registers the Vue contact form at deploy time -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name"><input name="email"><textarea name="message"></textarea><input name="bot-field">
    </form>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
